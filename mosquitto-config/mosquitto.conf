# ─── Mosquitto MQTT Broker Configuration ───────────────────────
# File: mosquitto-config/mosquitto.conf
# Place this in your Mosquitto config directory

# Allow connections on standard MQTT port
listener 1883

# Allow anonymous connections (for local dev)
# Set to false and configure password file for production
allow_anonymous true

# Persistence - saves messages across broker restarts
persistence true
persistence_location /var/lib/mosquitto/

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_type all

# Max connections
max_connections 100

# Keep-alive timeout (seconds)
# Sensors should send PINGREQ within this interval
keepalive_interval 60

# Message size limit (bytes) — 10KB is plenty for sensor JSON
message_size_limit 10240

# WebSocket listener — needed for browser-based clients
listener 9001
protocol websockets

# ─── For Production (uncomment and configure) ──────────────────
# Password file authentication
# password_file /etc/mosquitto/passwd
# allow_anonymous false

# TLS (requires certificates)
# listener 8883
# cafile /etc/mosquitto/ca.crt
# certfile /etc/mosquitto/server.crt
# keyfile /etc/mosquitto/server.key
